function tt(){const u=$('upb').style.display=='none',n=$('note').style.display=='none';$('upcc').title=T(u?'Mở rộng':'Thu gọn',u?'펼치기':'접기');$('ncc').title=T(n?'Mở rộng':'Thu gọn',n?'펼치기':'접기')}
function noteC(c){$('note').style.display=c?'none':'';$('ncc').textContent=c?'▸':'▾';tt();try{localStorage.setItem('v710nc',c?'1':'0')}catch(e){}}
{let c=1;try{const q=localStorage.getItem('v710nc');if(q!=null)c=+q}catch(e){}$('note').style.display=c?'none':'';$('ncc').textContent=c?'▸':'▾';$('ncc').onclick=()=>noteC($('note').style.display!='none')}
/* ===== Đồng bộ cloud (GitHub): PC xưởng quét thư mục rồi đẩy theo từng ngày; máy khác chỉ xem ===== */
const CLK={br:'main',st:'',busy:0,pbusy:0,dirty:0,tm:0,
tok:()=>{try{return localStorage.getItem('v710a_cl_tok')||''}catch(e){return''}},
repo:()=>{try{const o=localStorage.getItem('v710a_cl_repo');if(o)return o}catch(e){}if(/\.github\.io$/.test(location.hostname)){const r=location.pathname.split('/')[1];return location.hostname.split('.')[0]+'/'+(r||location.hostname)}return''},
win:()=>{let v=14;try{const q=localStorage.getItem('v710a_cl_win');if(q!=null&&!isNaN(+q))v=+q}catch(e){}return v},
sig:()=>{try{return JSON.parse(localStorage.getItem('v710a_cl_sig')||'{}')}catch(e){return{}}},
saveSig:o=>{try{localStorage.setItem('v710a_cl_sig',JSON.stringify(o))}catch(e){}}};
const clSay=m=>{CLK.st=m;const e=$('cls');if(e)e.textContent=m};
const clTm=()=>new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const clDay=x=>(x[7]||'').slice(0,10)||x[1];
const clH=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
const clSigOf=X=>{const a=X.map(x=>dk(x)+'|'+x[1]+'|'+x[2]+'|'+(x[10]||'')+'|'+(x[12]||'')+'|'+x[4]).sort();return a.length+'-'+clH(a.join('\n'))};
const clByDay=()=>{const m={};RAW.concat(UP).forEach(x=>{const d=clDay(x);(m[d]=m[d]||[]).push(x)});return m};
const clUnz=async buf=>JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
const clU8=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const clB64=b=>{let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
async function clPack(X){const ix=[],mp={},Y=X.map(x=>{const o=x.slice(),s=o[5];if(mp[s]==null){mp[s]=ix.length;ix.push(s)}o[5]=mp[s];return o});
return zGz(JSON.stringify({ver:1,dims:ix.map(s=>[SRC[s],DIMS[s]]),...qEnc(Y)}))}
function clDecode(Z){const X=qDec(Z),lm=(Z.dims||[]).map(([nm,D])=>{const k=sg(D);let ns=SIG[k];if(ns==null){ns=DIMS.push(D)-1;SIG[k]=ns;SRC[ns]=nm}return ns});X.forEach(x=>{x[5]=lm[x[5]]});return X}
function clMergeRows(X,remoteWins){const RM=new Map(R.map(y=>[y.dk0,y])),UPM=new Map(UP.map(y=>[dk(y),y]));let add=0,upd=0;const NEW=[];
X.forEach(x=>{const q=dk(x),e=RM.get(q);
if(!e){DEDUP.add(q);UP.push(x);NEW.push(x);const nr=mkR(x);R.push(nr);RM.set(q,nr);UPM.set(q,x);add++;return}
if(remoteWins&&(e.pd!==x[1]||e.ca!==(x[2]?'Đêm':'Ngày')||(e.ck||'')!==(x[12]||'')||e.md!==(x[10]||x[1]))){if(!x[9]&&e.pt)x[9]=e.pt;const nr=mkR(x),i=R.indexOf(e);if(i>=0)R[i]=nr;RM.set(q,nr);const u=UPM.get(q),j=u?UP.indexOf(u):-1;if(j>=0)UP[j]=x;else UP.push(x);UPM.set(q,x);upd++}});
return{add,upd,NEW}}
async function clPull(manual,first){const RP=CLK.repo();if(!RP){clSay(T('Chưa xác định kho cloud (mở link GitHub Pages hoặc nhập owner/repo)','클라우드 저장소 미지정(GitHub Pages 링크로 열거나 owner/repo 입력)'));return}
if(typeof DecompressionStream=='undefined'){clSay(T('Trình duyệt không hỗ trợ giải nén — dùng Chrome/Edge mới','압축 해제 미지원 — 최신 Chrome/Edge 사용'));return}
if(CLK.pbusy)return;CLK.pbusy=1;
try{const b='https://raw.githubusercontent.com/'+RP+'/'+CLK.br+'/',r=await fetch(b+'index.json?t='+Date.now(),{cache:'no-store'});
if(r.status==404){clSay(T('Cloud: chưa có dữ liệu','Cloud: 데이터 없음'));CLK.pbusy=0;return}if(!r.ok)throw new Error('HTTP '+r.status);
const J=await r.json();if(J.ver!==1){clSay(T('Cloud: sai phiên bản dữ liệu','Cloud: 데이터 버전 불일치'));CLK.pbusy=0;return}
const days=Object.keys(J.days||{}).sort().reverse(),w=CLK.win(),want=w>0?days.slice(0,w):days,LP=CLK.sig();let add=0,upd=0,got=0;const NEW=[];
for(const d of want){const m=J.days[d];if(LP[d]===m.sig)continue;
clSay(T('Cloud: đang tải ','Cloud: 불러오는 중 ')+d+' ('+(got+1)+')…');
const rr=await fetch(b+'data/'+d+'.json.gz?t='+m.sig,{cache:'no-store'});if(!rr.ok)continue;
const X=clDecode(await clUnz(new Uint8Array(await rr.arrayBuffer()))),o=clMergeRows(X,!CLK.tok());add+=o.add;upd+=o.upd;NEW.push(...o.NEW);got++;
if(clSigOf(clByDay()[d]||[])===m.sig)LP[d]=m.sig}
CLK.saveSig(LP);
if(add||upd){await persist();afterData(first?NEW:null)}else if(manual)render();
clSay(T('Cloud: đã đồng bộ ','Cloud: 동기화 완료 ')+clTm()+(got?' · '+got+T(' ngày',' 일'):'')+(add?' · +'+add+T(' mẫu',' 건'):'')+(upd?' · '+upd+T(' mẫu sửa',' 건 수정'):'')+' · '+T('hiển thị ','표시 ')+(w>0?w+T(' ngày gần nhất',' 일'):T('tất cả','전체')))}
catch(e){clSay(T('Cloud: không tải được (','Cloud: 불러오기 실패 (')+e.message+')')}CLK.pbusy=0}
async function ghGet(RP,tk,path){const h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'},u='https://api.github.com/repos/'+RP+'/contents/'+path+'?ref='+CLK.br,r=await fetch(u,{headers:h,cache:'no-store'});
if(r.status==404)return{sha:null,buf:null};if(!r.ok)throw new Error('GitHub '+r.status+(r.status==401||r.status==403?' (token sai/thiếu quyền)':''));
const m=await r.json();let buf;if(m.content&&m.encoding=='base64')buf=Uint8Array.from(atob(m.content.replace(/\n/g,'')),c=>c.charCodeAt(0));
else{const r2=await fetch(u,{headers:{...h,Accept:'application/vnd.github.raw+json'},cache:'no-store'});buf=new Uint8Array(await r2.arrayBuffer())}return{sha:m.sha,buf}}
const ghPut=(RP,tk,path,b64,sha,msg)=>{const body={message:msg,content:b64,branch:CLK.br};if(sha)body.sha=sha;return fetch('https://api.github.com/repos/'+RP+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'},body:JSON.stringify(body)})};
async function clPush(manual){const RP=CLK.repo(),tk=CLK.tok();if(!RP||!tk){clSay(T('Chưa nhập kho/token','저장소/토큰 미입력'));return}
if(typeof CompressionStream=='undefined'){clSay(T('Trình duyệt không hỗ trợ nén','압축 미지원'));return}
if(CLK.busy){CLK.dirty=1;return}CLK.busy=1;
try{const LP=CLK.sig(),by=clByDay(),todo=Object.keys(by).sort().filter(d=>clSigOf(by[d])!==LP[d]);
if(!todo.length){clSay(T('Cloud đã mới nhất, không có dữ liệu mới để đẩy · ','Cloud 최신 — 보낼 새 데이터 없음 · ')+clTm());CLK.busy=0;return}
const pend={};let n=0,tot=0,cnt=0;
const flush=async()=>{if(!Object.keys(pend).length)return;for(let t=0;t<3;t++){const rem=await ghGet(RP,tk,'index.json');let J={ver:1,days:{}};if(rem.buf){try{J=JSON.parse(new TextDecoder().decode(rem.buf))}catch(e){}if(!J.days)J.days={};J.ver=1}
Object.assign(J.days,pend);J.at=Date.now();const r=await ghPut(RP,tk,'index.json',clU8(JSON.stringify(J)),rem.sha,'index '+new Date().toISOString());
if(r.status==409||r.status==422)continue;if(!r.ok)throw new Error('GitHub '+r.status);Object.keys(pend).forEach(k=>delete pend[k]);CLK.saveSig(LP);return}
throw new Error(T('xung đột index, thử lại sau','index 충돌'))};
for(const d of todo.slice().reverse()){n++;clSay(T('Đang đẩy cloud ','Cloud 전송 중 ')+d+' ('+n+'/'+todo.length+')…');let ok=0;
for(let t=0;t<3&&!ok;t++){const rem=await ghGet(RP,tk,'data/'+d+'.json.gz');let X=by[d];const mine=clSigOf(X);let same=false;
if(rem.buf){const rx=clDecode(await clUnz(rem.buf)),seen=new Map(X.map(x=>[dk(x),x]));rx.forEach(x=>{const q=dk(x);if(!seen.has(q))seen.set(q,x)});X=[...seen.values()];same=clSigOf(rx)===clSigOf(X)}
const sig=clSigOf(X);
if(!same){const r=await ghPut(RP,tk,'data/'+d+'.json.gz',await clPack(X),rem.sha,'sync '+d+' '+new Date().toISOString());if(r.status==409||r.status==422)continue;if(!r.ok)throw new Error('GitHub '+r.status+(r.status==401||r.status==403?' (token sai/thiếu quyền)':''))}
pend[d]={n:X.length,sig};tot+=X.length;cnt++;if(sig===mine)LP[d]=sig;ok=1}
if(!ok)throw new Error(T('xung đột, thử lại sau','충돌, 나중에 재시도'));
if(Object.keys(pend).length>=3)await flush()}
await flush();clSay(T('Đã đẩy lên cloud ','Cloud 전송 완료 ')+clTm()+' · '+cnt+T(' ngày',' 일')+' · '+tot+T(' mẫu',' 건'));CLK.busy=0;return}
catch(e){clSay(T('Đẩy cloud lỗi: ','Cloud 전송 오류: ')+e.message)}CLK.busy=0;if(CLK.dirty){CLK.dirty=0;setTimeout(clPush,2000)}}
function clDirty(){if(!CLK.tok()||!CLK.repo())return;try{if(localStorage.getItem('v710a_cl_auto')==='0')return}catch(e){}clearTimeout(CLK.tm);CLK.tm=setTimeout(clPush,3000)}
function clUi(){let d=$('clw');if(!d){d=document.createElement('details');d.id='clw';d.style.marginTop='8px';$('upb').appendChild(d)}const o=d.open;
d.innerHTML=`<summary>${T('Đồng bộ cloud (xem online)','클라우드 동기화(온라인 보기)')}</summary><div class="sub" id="cls" style="margin:4px 0"></div>
<div class="ur"><span class="sub">${T('Tải dữ liệu của','불러올 기간')}</span><select id="clw2">${[[7,T('7 ngày gần nhất','최근 7일')],[14,T('14 ngày gần nhất','최근 14일')],[30,T('30 ngày gần nhất','최근 30일')],[90,T('90 ngày gần nhất','최근 90일')],[0,T('Tất cả','전체')]].map(([v,t])=>`<option value="${v}"${CLK.win()==v?' selected':''}>${t}</option>`).join('')}</select><button id="clp">${T('Tải dữ liệu cloud ngay','지금 클라우드 불러오기')}</button></div>
<div class="sub" style="margin:6px 0 2px"><b>${T('Chỉ PC xưởng cần nhập phần dưới','작업장 PC만 아래 입력')}</b> ${T('(máy chỉ xem thì bỏ qua). Thư mục quét chọn ở mục trên.','(보기 전용 PC는 건너뜀). 스캔 폴더는 위에서 선택.')}</div>
<div class="ur"><label>${T('Kho GitHub','GitHub 저장소')} <input type="text" id="clr" style="min-width:200px;flex:none"></label><label>Token <input type="password" id="clt" size="26" placeholder="github_pat_..."></label><button id="cls2">${T('Lưu','저장')}</button><button id="clh">${T('Đẩy lên cloud ngay','지금 클라우드로 보내기')}</button></div>`;
d.open=o;$('clr').value=CLK.repo();$('clt').value=CLK.tok()?'••••••••':'';
$('clw2').onchange=()=>{try{localStorage.setItem('v710a_cl_win',$('clw2').value)}catch(e){}clPull(true)};
$('clp').onclick=()=>clPull(true);$('clh').onclick=()=>clPush(true);
$('cls2').onclick=()=>{const r=$('clr').value.trim(),t=$('clt').value.trim();try{if(r)localStorage.setItem('v710a_cl_repo',r);if(t&&!/^•+$/.test(t))localStorage.setItem('v710a_cl_tok',t)}catch(e){}$('clt').value=CLK.tok()?'••••••••':'';clSay(T('Đã lưu cấu hình','설정 저장됨'));clPull(true)};
clSay(CLK.st||(CLK.repo()?T('Kho: ','저장소: ')+CLK.repo():T('Chưa xác định kho (mở link GitHub Pages hoặc nhập owner/repo)','저장소 미지정')))}
function clStart(){clUi();if(CLK.repo())clPull(false,true).then(()=>{if(CLK.tok())clDirty()});setInterval(()=>{if(!document.hidden)clPull()},300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CLK.repo())clPull()})}

applyLang();render();cfgTab();initUp().then(clStart,clStart);
</script></body></html>
